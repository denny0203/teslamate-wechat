name: teslamate

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  teslamate:
    image: teslamate/teslamate:4.3.0
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${DATABASE_PASS:?required}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      MQTT_HOST: mosquitto
      TZ: Asia/Shanghai
      CHECK_ORIGIN: "http://127.0.0.1:14000,http://localhost:14000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./import:/opt/app/import
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging: *logging

  database:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${DATABASE_PASS:?required}
      POSTGRES_DB: teslamate
    volumes:
      - teslamate-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U teslamate -d teslamate"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  grafana:
    image: teslamate/grafana:4.3.0
    restart: unless-stopped
    environment:
      DATABASE_USER: teslamate
      DATABASE_PASS: ${DATABASE_PASS:?required}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    depends_on:
      database:
        condition: service_healthy
    logging: *logging

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    logging: *logging

volumes:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-conf:
  mosquitto-data:
