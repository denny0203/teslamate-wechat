name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/audit_public.py
      - run: bash -n ops/bootstrap.sh ops/install_sync.sh
      - name: Validate Compose without printing secrets
        run: docker compose --env-file ops/.env.example -f ops/compose.yaml config --quiet
